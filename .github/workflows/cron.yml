name: Random Cron

on:
  workflow_run:
    workflows: ["刷步数"]
    types:
      - completed
  workflow_dispatch:

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }}
          persist-credentials: true

      - name: Random Cron
        env:
          CRON_HOURS: ${{ vars.CRON_HOURS }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -e

          source cron_convert.sh

          echo "configured CRON_HOURS: ${CRON_HOURS}"

          persist_execute_log "$EVENT_NAME" "$CRON_HOURS"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            current=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')

            git commit -m "[${current}] random cron trigger by ${EVENT_NAME}"

            git push origin HEAD:master

            echo "随机定时任务更新成功！"
          else
            echo "没有文件变化，跳过提交和推送。"
          fi
